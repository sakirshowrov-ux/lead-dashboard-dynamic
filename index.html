<style>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ================= utilities ================= */
function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function hexToRgba(hex, a){
  const h = hex.replace("#","");
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return "rgba("+r+","+g+","+b+","+a+")";
}
function fmtMoney(n){ return "$" + Math.round(n||0).toLocaleString("en-US"); }
function fmtMoneyCompact(n){
  n = n||0;
  if (!isFinite(n)) return "—";
  if (Math.abs(n) >= 1000000) return "$" + (n/1000000).toFixed(1).replace(/\.0$/,"") + "M";
  if (Math.abs(n) >= 1000) return "$" + (n/1000).toFixed(1).replace(/\.0$/,"") + "K";
  return "$" + Math.round(n).toLocaleString("en-US");
}
function fmtPct(n, d){ return (isFinite(n)? n : 0).toFixed(d==null?1:d) + "%"; }
function fmtX(n){ return isFinite(n) ? n.toFixed(2) + "x" : "0.00x"; }
function fmtDate(iso){ const d = new Date(iso + "T00:00:00"); return d.toLocaleDateString("en-US", { month:"short", day:"numeric" }); }
function safeDiv(a,b){ return b ? a/b : 0; }
function money(n){ return fmtMoney(n); }
function csvEscape(v){
  const s = v==null ? "" : String(v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function toCSV(headers, rows){
  const lines = [headers.map(csvEscape).join(",")];
  rows.forEach(r=> lines.push(r.map(csvEscape).join(",")));
  return lines.join("\r\n");
}
async function getDownloadsApi(){
  try {
    if (!window.claude || typeof window.claude.use !== "function") return null;
    return await window.claude.use("downloads");
  } catch(e){ return null; }
}

/* ================= constants ================= */
const CHANNELS = [
  { key:"meta", label:"Meta Ads", series:"--series-1" },
  { key:"email", label:"Email", series:"--series-2" },
  { key:"website", label:"Website", series:"--series-3" },
];
function channelInfo(type){ return CHANNELS.find(c=>c.key===type) || CHANNELS[0]; }

const BASE_VENDORS = [
  { name:"Lobeline", type:"meta" }, { name:"Hawksem", type:"meta" }, { name:"Setfire", type:"meta" },
  { name:"Prospect Out", type:"email" }, { name:"ElevateMktg", type:"email" }, { name:"IClientCare", type:"email" }, { name:"BuzzHawk", type:"email" }, { name:"Ultragrowth", type:"email" },
  { name:"MedVirtual Website", type:"website" }, { name:"MyMedical VA website", type:"website" },
].map(v=>({ ...v, status:"Active" }));

const STATUSES = ["New","Applicant","Demo Booked","No Show","Demo Done","Active Client","Unqualified"];
const QUALIFIED_STATUSES = new Set(["Active Client","New","Demo Booked","Demo Done"]);
const DNC_STATUSES = new Set(["Applicant","No Show","Unqualified"]);
const STATUS_META = {
  "New":           { badge: "badge-outline", dot: "var(--text-muted)" },
  "Applicant":     { badge: "badge-fill",    dot: "var(--text-muted)" },
  "Demo Booked":   { badge: "badge-fill",    dot: "var(--text-muted)" },
  "No Show":       { badge: "badge-warning", dot: "var(--warning)" },
  "Demo Done":     { badge: "badge-warning", dot: "var(--warning)" },
  "Active Client": { badge: "badge-good",    dot: "var(--good)" },
  "Unqualified":   { badge: "badge-outline", dot: "var(--text-muted)" },
};

const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const YEARS = ["2025","2026","2027","2028","2029","2030"];
const MONTH_OPTIONS = MONTH_NAMES.map((name,i)=>({ value: String(i+1).padStart(2,"0"), label: name }));
function currentMonthKey(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function monthLabel(key){
  if (!key || key==="all") return "";
  const [y,m] = key.split("-");
  return MONTH_NAMES[parseInt(m,10)-1] + " " + y;
}
/**
 * Resolves the active filters into a finance scope: an exact editable month
 * (year+month, or the real current month when neither is picked), or a
 * read-only aggregate across a whole year or across one month in every year.
 */
function resolveFinanceScope(filters){
  if (filters.year!=="all" && filters.month!=="all"){
    const key = filters.year+"-"+filters.month;
    return { mode:"month", key, editable:true, label: monthLabel(key) };
  }
  if (filters.year!=="all") return { mode:"year", year:filters.year, editable:false, label: filters.year+" (full year)" };
  if (filters.month!=="all") return { mode:"monthAnyYear", month:filters.month, editable:false, label: MONTH_NAMES[parseInt(filters.month,10)-1]+" (all years)" };
  const key = currentMonthKey();
  return { mode:"month", key, editable:true, label: monthLabel(key)+" (current)" };
}
function financeForScope(finance, vendor, scope){
  const rec = finance[vendor] || {};
  if (scope.mode === "year"){
    let budget=0, spend=0;
    Object.keys(rec).forEach(k=>{ if (k.startsWith(scope.year+"-")){ budget+=rec[k].budget||0; spend+=rec[k].spend||0; } });
    return { budget, spend };
  }
  if (scope.mode === "monthAnyYear"){
    let budget=0, spend=0;
    Object.keys(rec).forEach(k=>{ if (k.endsWith("-"+scope.month)){ budget+=rec[k].budget||0; spend+=rec[k].spend||0; } });
    return { budget, spend };
  }
  return rec[scope.key] || { budget:0, spend:0 };
}
function sumFinanceForScope(names, finance, scope){
  return names.reduce((acc,n)=>{
    const f = financeForScope(finance, n, scope);
    acc.budget += f.budget; acc.spend += f.spend; return acc;
  }, { budget:0, spend:0 });
}

const METRIC_TABS = [
  { key: "spend", label: "Spend & leads" },
  { key: "efficiency", label: "Efficiency" },
  { key: "funnel", label: "Funnel & demo" },
  { key: "sales", label: "Client & sales" },
  { key: "returns", label: "Performance & return" },
];
const METRIC_COLUMNS = {
  spend: [
    { key: "budget", label: "Allocated budget", fmt: m => fmtMoney(m.budget) },
    { key: "spend", label: "Daily spend", fmt: m => fmtMoney(m.spend) },
    { key: "totalLeads", label: "Total leads", fmt: m => m.totalLeads },
    { key: "qualifiedLeads", label: "Qualified leads", fmt: m => m.qualifiedLeads },
  ],
  efficiency: [
    { key: "cpl", label: "CPL", fmt: m => money(m.cpl) },
    { key: "cpql", label: "CPQL", fmt: m => money(m.cpql) },
    { key: "costPerQualDemo", label: "Cost / qual. demo booked", fmt: m => money(m.costPerQualDemo) },
    { key: "costPerDemoCompleted", label: "Cost / demo completed", fmt: m => money(m.costPerDemoCompleted) },
  ],
  funnel: [
    { key: "qualifiedDemosBooked", label: "Qualified demos booked", fmt: m => m.qualifiedDemosBooked },
    { key: "totalDemosCompleted", label: "Total demos completed", fmt: m => m.totalDemosCompleted },
  ],
  sales: [
    { key: "totalProjectedDeal", label: "Projected deal amount", fmt: m => fmtMoney(m.totalProjectedDeal) },
    { key: "contractsSent", label: "Contracts sent", fmt: m => m.contractsSent },
    { key: "activeClients", label: "Active clients", fmt: m => m.activeClients },
    { key: "vaOnboarded", label: "VA onboarded", fmt: m => m.vaOnboarded },
    { key: "totalClosedContract", label: "Closed contract amount", fmt: m => fmtMoney(m.totalClosedContract) },
  ],
  returns: [
    { key: "conversionRate", label: "Conversion rate", fmt: m => fmtPct(m.conversionRate) },
    { key: "roas", label: "ROAS", fmt: m => fmtX(m.roas) },
    { key: "cac", label: "CAC", fmt: m => money(m.cac) },
  ],
};

/* ================= metrics ================= */
function computeGroupMetrics(list, finance){
  const budget = finance.budget || 0, spend = finance.spend || 0;
  const totalLeads = list.length;
  const qualifiedLeads = list.filter(l=>QUALIFIED_STATUSES.has(l.status)).length;
  const dncLeads = list.filter(l=>DNC_STATUSES.has(l.status)).length;
  const unqualifiedLeads = list.filter(l=>l.status==="Unqualified").length;
  const qualifiedDemosBooked = list.filter(l=>l.status==="Demo Booked"||l.status==="Demo Done"||l.status==="Active Client").length;
  const totalDemosCompleted = list.filter(l=>l.status==="Demo Done"||l.status==="Active Client").length;
  const activeClients = list.filter(l=>l.status==="Active Client").length;
  const contractsSent = list.filter(l=>l.contractSent).length;
  const vaOnboarded = list.filter(l=>l.vaOnboarded).length;
  const totalProjectedDeal = list.reduce((s,l)=> s + (l.projectedDealAmount||0), 0);
  const totalClosedContract = list.reduce((s,l)=> s + (l.closedContractAmount||0), 0);
  const conversionRate = totalLeads ? activeClients/totalLeads*100 : 0;
  return {
    budget, spend, totalLeads, qualifiedLeads, dncLeads, unqualifiedLeads, qualifiedDemosBooked, totalDemosCompleted,
    activeClients, contractsSent, vaOnboarded, totalProjectedDeal, totalClosedContract, conversionRate,
    cpl: safeDiv(spend,totalLeads), cpql: safeDiv(spend,qualifiedLeads),
    costPerQualDemo: safeDiv(spend,qualifiedDemosBooked), costPerDemoCompleted: safeDiv(spend,totalDemosCompleted),
    roas: safeDiv(totalClosedContract,spend), cac: safeDiv(spend,activeClients),
    contractCloseRate: safeDiv(activeClients,contractsSent)*100,
    vaVelocity: safeDiv(vaOnboarded,activeClients)*100,
  };
}
function getFinance(finance, vendor, monthKey){
  return (finance[vendor] && finance[vendor][monthKey]) || { budget:0, spend:0 };
}

/* ================= chart plugins ================= */
const crosshairPlugin = {
  id: "crosshair",
  afterDraw(chart){
    const active = chart.tooltip && chart.tooltip._active;
    if (active && active.length){
      const x = active[0].element.x;
      const { top, bottom } = chart.chartArea;
      const ctx = chart.ctx;
      ctx.save(); ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, bottom);
      ctx.lineWidth = 1; ctx.strokeStyle = cssVar("--baseline"); ctx.stroke(); ctx.restore();
    }
  }
};
const lineEndLabels = {
  id: "lineEndLabels",
  afterDatasetsDraw(chart){
    const ctx = chart.ctx; const points = [];
    chart.data.datasets.forEach((ds, i)=>{
      const meta = chart.getDatasetMeta(i);
      if (meta.hidden) return;
      for (let j = ds.data.length-1; j>=0; j--){
        if (ds.data[j] != null){ points.push({ x: meta.data[j].x, y: meta.data[j].y, color: ds.borderColor, value: ds.data[j] }); break; }
      }
    });
    points.sort((a,b)=>a.y-b.y);
    const minGap = 14;
    for (let i=1;i<points.length;i++){
      if (points[i].y - points[i-1].y < minGap) points[i].y = points[i-1].y + minGap;
    }
    ctx.save(); ctx.font = "600 11px IBM Plex Mono, monospace"; ctx.textBaseline = "middle"; ctx.textAlign = "left";
    points.forEach(p=>{
      ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = cssVar("--text-secondary"); ctx.fillText(p.value.toFixed(1)+"%", p.x+9, p.y);
    });
    ctx.restore();
  }
};
const barValueLabels = {
  id: "barValueLabels",
  afterDatasetsDraw(chart){
    const ctx = chart.ctx;
    chart.data.datasets.forEach((ds,i)=>{
      const meta = chart.getDatasetMeta(i);
      meta.data.forEach((bar, idx)=>{
        const value = ds.data[idx];
        if (value==null) return;
        ctx.save(); ctx.font = "600 11.5px IBM Plex Mono, monospace"; ctx.fillStyle = cssVar("--text-secondary");
        ctx.textBaseline = "middle"; ctx.textAlign = "left";
        ctx.fillText(ds.moneyLabels ? fmtMoneyCompact(value) : String(value), bar.x + 8, bar.y);
        ctx.restore();
      });
    });
  }
};
function tooltipBase(){
  return {
    backgroundColor: cssVar("--surface-raised"), titleColor: cssVar("--text-primary"), bodyColor: cssVar("--text-primary"),
    borderColor: cssVar("--border"), borderWidth: 1, padding: 10,
    titleFont: { family: "IBM Plex Sans", weight: "600", size: 12 }, bodyFont: { family: "IBM Plex Mono", size: 12 },
    boxPadding: 4, cornerRadius: 8, displayColors: true, boxWidth: 8, boxHeight: 8,
  };
}

/* ================= small building blocks ================= */
function ChannelBadge({ type }){

      <span className="dot" style={{ background: "var("+c.series+")" }}></span>{c.label}

}
function StatusBadge({ status }){
  const m = STATUS_META[status] || STATUS_META.New;
  return <span className={"badge "+m.badge}><span className="dot" style={{background:m.dot}}></span>{status}</span>;
}
function ToggleBadge({ value, onLabel, offLabel, onClick }){
  const cls = value ? "badge-good" : "badge-fill";
  const dotColor = value ? "var(--good)" : "var(--text-muted)";
  const label = value ? (onLabel||"Yes") : (offLabel||"No");
  if (!onClick) return <span className={"badge "+cls}><span className="dot" style={{background:dotColor}}></span>{label}</span>;
  return (
    <button type="button" className={"badge "+cls} onClick={onClick} title="Click to toggle">
      <span className="dot" style={{background:dotColor}}></span>{label}
    </button>
  );
}
function Segmented({ options, value, onChange }){
  return (
    <div className="segmented">
      {options.map(o=>(
        <button key={o.value} type="button" className={value===o.value?"active":""} onClick={()=>onChange(o.value)}>
          {o.dotColor && <span className="dot" style={{background:o.dotColor}}></span>}
          {o.label}
        </button>
      ))}
    </div>
  );
}
function Sparkline({ values, color }){
  const nums = values.filter(v=>v!=null);
  if (!nums.length) return null;
  const w=96,h=26;
  const max = Math.max(...nums,1), min = Math.min(...nums,0), range=(max-min)||1, n=values.length;
  const pts = [];
  values.forEach((v,i)=>{ if (v==null) return; const x=n>1?(i/(n-1))*w:w/2; const y=h-((v-min)/range)*h; pts.push(x.toFixed(1)+","+y.toFixed(1)); });
  return <svg viewBox={"0 0 "+w+" "+h} width={w} height={h} className="mt-2" preserveAspectRatio="none"><polyline points={pts.join(" ")} fill="none" stroke={color} strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"/></svg>;
}

/* ================= KPI row ================= */

    { label:"Cost per lead", value: money(metrics.cpl) },
    { label:"Conversion rate", value: fmtPct(metrics.conversionRate), spark:<Sparkline values={weeklyConv} color="var(--good)" /> },

            </div>

            <React.Fragment>

/* ================= insights panel ================= */
function InsightsPanel({ vendorRows, overallMetrics, periodLabel }){
  const withSpend = vendorRows.filter(r=>r.spend>0);
  let topRoi = null;
  for (const r of withSpend){ if (!topRoi || r.roas > topRoi.roas) topRoi = r; }
  const withDemos = vendorRows.filter(r=>r.totalDemosCompleted>0 && r.spend>0);
  let bestCpd = null;
  for (const r of withDemos){ if (!bestCpd || r.costPerDemoCompleted < bestCpd.costPerDemoCompleted) bestCpd = r; }

  const cards = [
    {
      title: "Top ROI vendor",
      value: topRoi ? fmtX(topRoi.roas) : "—",
      detail: topRoi ? topRoi.key+" ("+channelInfo(topRoi.type).label+") is returning "+fmtX(topRoi.roas)+" on every dollar spent for "+periodLabel+" — your most efficient vendor this period." : "Add spend and a closed contract amount to see your top-performing vendor for "+periodLabel+".",
    },
    {
      title: "Best cost per demo",
      value: bestCpd ? money(bestCpd.costPerDemoCompleted) : "—",
      detail: bestCpd ? bestCpd.key+" ("+channelInfo(bestCpd.type).label+") completes demos for "+money(bestCpd.costPerDemoCompleted)+" each in "+periodLabel+" — your most cost-effective vendor for demos." : "Complete a demo with recorded spend to see your most cost-effective vendor.",
    },
    {
      title: "Contract closing efficiency",
      value: overallMetrics.contractsSent ? fmtPct(overallMetrics.contractCloseRate) : "—",
      detail: overallMetrics.contractsSent ? overallMetrics.activeClients+" of "+overallMetrics.contractsSent+" sent contracts ("+fmtPct(overallMetrics.contractCloseRate)+") have become active clients." : "Mark contracts as sent to track how many convert to active clients.",
    },
    {
      title: "VA onboarding velocity",
      value: overallMetrics.activeClients ? fmtPct(overallMetrics.vaVelocity) : "—",
      detail: overallMetrics.activeClients ? overallMetrics.vaOnboarded+" of "+overallMetrics.activeClients+" active clients ("+fmtPct(overallMetrics.vaVelocity)+") have an onboarded VA." : "Mark active clients as VA onboarded to track onboarding pace.",
    },
  ];
  return (
    <div>
      <div className="flex items-center gap-2 mb-3">
        <span className="eyebrow">Real-time insights</span>
      </div>
      <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
        {cards.map((c,i)=>(
          <div key={i} className="insight-card p-4">
            <div className="flex items-baseline justify-between gap-2 mb-1.5">
              <span className="text-[12.5px] font-semibold" style={{color:"var(--text-secondary)"}}>{c.title}</span>
              <span className="kpi-value" style={{fontSize:"18px"}}>{c.value}</span>
            </div>
            <p className="text-[12px] leading-snug" style={{color:"var(--text-muted)"}}>{c.detail}</p>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ================= channel split ================= */
function ChannelSplit({ channelRows }){
  const total = channelRows.reduce((s,c)=>s+c.totalLeads,0);
  if (!total) return <div className="empty-state">No leads match the current filters.</div>;
  return (
    <div className="flex flex-col gap-4">
      <div className="w-full flex rounded-full overflow-hidden" style={{height:"14px", background:"var(--gridline)"}}>
        {channelRows.map((c,i)=>{
          const pct = total ? c.totalLeads/total*100 : 0;
          if (pct<=0) return null;
          return <div key={c.key} style={{width:pct+"%", background:"var("+c.series+")", borderRight: i<channelRows.length-1 ? "2px solid var(--surface-1)" : "none"}}></div>;
        })}
      </div>
      {channelRows.map(c=>{
        const pct = total ? c.totalLeads/total*100 : 0;
        return (
          <div key={c.key} className="flex items-center justify-between gap-3 text-[13px]">
            <div className="flex items-center gap-2 min-w-0"><span className="dot" style={{background:"var("+c.series+")"}}></span><span className="font-medium truncate">{c.label}</span></div>
            <div className="flex items-center gap-3 font-mono text-[12px] flex-none" style={{color:"var(--text-secondary)"}}>
              <span>{c.totalLeads} {c.totalLeads===1?"lead":"leads"}</span><span>{pct.toFixed(0)}%</span>
              <span style={{color:"var(--text-muted)"}}>{fmtPct(c.conversionRate)} conv</span>
            </div>
          </div>
        );
      })}
    </div>
  );
}

      ))}
    </div>
  );
}

function VendorTable({ rows, activeTab, sortState, onSort }){
  const cols = METRIC_COLUMNS[activeTab];
  const sorted = useMemo(()=>{
    const copy = rows.slice();
    copy.sort((a,b)=>{
      let av = a[sortState.key], bv = b[sortState.key];
      if (av === undefined) av = a.key; if (bv === undefined) bv = b.key;
      if (typeof av === "string") return sortState.dir==="asc" ? av.localeCompare(bv) : bv.localeCompare(av);
      return sortState.dir==="asc" ? av-bv : bv-av;
    });
    return copy;
  }, [rows, sortState]);
  function Th({ colKey, children }){
    return <th onClick={()=>onSort(colKey)}>{children}{sortState.key===colKey ? (sortState.dir==="asc"?" ▲":" ▼") : ""}</th>;
  }
  if (!sorted.length) return <div className="empty-state">No vendors match the current filters.</div>;
  return (
    <div className="table-wrap scrollbar-thin" style={{maxHeight:340}}>
      <table>
        <thead>
          <tr>
            <Th colKey="key">Vendor</Th>
            <Th colKey="type">Channel</Th>
            <Th colKey="status">Status</Th>
            {cols.map(c=><Th key={c.key} colKey={c.key}>{c.label}</Th>)}
          </tr>
        </thead>
        <tbody>
          {sorted.map(r=>(
            <tr key={r.key}>
              <td className="font-medium">{r.key}</td>
              <td><ChannelBadge type={r.type} /></td>
              <td><VendorStatusBadge status={r.status} /></td>
              {cols.map(c=><td key={c.key} className="num-cell">{c.fmt(r)}</td>)}
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

/* ================= lead duplicate + bulk import helpers ================= */
function normalizeEmail(v){ return (v||"").trim().toLowerCase(); }
function DuplicateLeadModal({lead,onSubmitAnyway,onCancel,onDiscard}){
  return <div className="modal-overlay" onMouseDown={e=>{if(e.target===e.currentTarget)onCancel()}}>
    <div className="card w-full max-w-[440px] p-5" role="dialog" aria-modal="true" onMouseDown={e=>e.stopPropagation()}>

      <div className="card mt-4 p-3" style={{background:"var(--surface-raised)"}}>
        <div className="font-medium text-[13px]">{lead?.name||"Existing lead"}</div>
        {lead?.email&&<div className="text-[12px] mt-1" style={{color:"var(--text-secondary)"}}>{lead.email}</div>}
              </div>
      <div className="flex justify-end gap-2 mt-5 flex-wrap">
        <button type="button" className="btn btn-ghost" onClick={onDiscard}>Discard</button>

function BulkUploadModal({vendors,onClose,onComplete}){
  const [busy,setBusy]=useState(false),[result,setResult]=useState(null),[error,setError]=useState("");
  const fileRef=useRef(null);
  function parseValue(row,...names){ for(const n of names){ const k=Object.keys(row).find(x=>x.trim().toLowerCase()===n.trim().toLowerCase()); if(k!=null&&row[k]!==""&&row[k]!=null)return row[k]; } return ""; }
  function boolValue(v){ return ["yes","true","1","y"].includes(String(v||"").trim().toLowerCase()); }
  async function processFile(file){
    if(!file)return;
    setBusy(true);setError("");setResult(null);
    try{
      if(!window.XLSX) throw new Error("Excel import is still loading. Please try again.");
      const ext=(file.name.split(".").pop()||"").toLowerCase();
      if(!["xlsx","xls"].includes(ext)) throw new Error("Please upload an .xlsx or .xls file.");
      const data=await file.arrayBuffer();
      const wb=XLSX.read(data,{type:"array"});
      const sheet=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(sheet,{defval:""});
      if(!rows.length) throw new Error("The uploaded spreadsheet is empty.");
      let added=0,updated=0,failed=0;
      const errors=[];
      for(let i=0;i<rows.length;i++){
        const r=rows[i];
        const email=normalizeEmail(parseValue(r,"Email"));
        const name=String(parseValue(r,"Lead Name","Name")||"").trim();
        if(!name){failed++;errors.push(`Row ${i+2}: Lead Name is required.`);continue;}
        if(!email){failed++;errors.push(`Row ${i+2}: Email is required for duplicate matching.`);continue;}
        const status=String(parseValue(r,"Lead Status","Status","Deal Stage")||"New").trim();
        const vendorTypeRaw=String(parseValue(r,"Channel")||"meta").trim().toLowerCase();
        const typeMap={"meta ads":"meta",meta:"meta",email:"email",website:"website"};
        const vendorType=typeMap[vendorTypeRaw]||vendorTypeRaw;
        const vendor=String(parseValue(r,"Vendor")||"").trim();
        const dateRaw=parseValue(r,"Date Acquired","Date");
        let dateAcquired="";
        if(typeof dateRaw==="number"&&XLSX.SSF){ const d=XLSX.SSF.parse_date_code(dateRaw); if(d) dateAcquired=`${d.y}-${String(d.m).padStart(2,"0")}-${String(d.d).padStart(2,"0")}`; }
        else dateAcquired=String(dateRaw||"").slice(0,10);
        const dataObj={name,email,hubspotUrl:String(parseValue(r,"HubSpot URL","Hubspot URL")||"").trim(),vendorType,vendor,dateAcquired,status:STATUSES.includes(status)?status:"New",projectedDealAmount:Math.max(0,parseFloat(parseValue(r,"Projected Deal Amount"))||0),closedContractAmount:Math.max(0,parseFloat(parseValue(r,"Closed Contract Amount"))||0),contractSent:boolValue(parseValue(r,"Contract Sent")),vaOnboarded:boolValue(parseValue(r,"VA Onboarded"))};
        if(!dataObj.vendor){ const first=vendors.find(v=>v.type===vendorType&&v.status==="Active"); dataObj.vendor=first?.name||""; }
        if(!dataObj.dateAcquired) dataObj.dateAcquired=new Date().toISOString().slice(0,10);
        try{
          let existing=null;
          // Email is the primary matching key. ID is an optional fallback.
          if(email){ const q=await supabaseClient.from("leads").select("*").ilike("email",email).limit(1); if(q.error) throw q.error; existing=q.data?.[0]||null; }
          const id=String(parseValue(r,"ID","Lead ID","Unique ID")||"").trim();
          if(!existing&&id){ const q=await supabaseClient.from("leads").select("*").eq("id",id).maybeSingle(); if(q.error) throw q.error; existing=q.data; }
          if(existing){
            let payload=uiLeadToDb(dataObj); delete payload.id;
            let q=await supabaseClient.from("leads").update(payload).eq("id",existing.id).select().single();
            if(q.error) throw q.error;
            updated++;
          }else{
            let payload=uiLeadToDb(dataObj); let q=await supabaseClient.from("leads").insert(payload).select().single();
            if(q.error) throw q.error;
            added++;
          }
        }catch(e){failed++;errors.push(`Row ${i+2}: ${e.message||"Could not save row."}`);}
      }
      setResult({added,updated,failed,errors});
      await onComplete();
    }catch(e){setError(e.message||"Could not import the spreadsheet.");}
    finally{setBusy(false);if(fileRef.current)fileRef.current.value="";}
  }
  return <div className="modal-overlay" onMouseDown={e=>{if(e.target===e.currentTarget&&!busy)onClose()}}>
    <div className="card w-full max-w-[620px] p-5" role="dialog" aria-modal="true" onMouseDown={e=>e.stopPropagation()}>
      <div className="flex items-center justify-between mb-2"><h3 className="font-display font-semibold text-[16px]">Bulk Excel upload</h3><button type="button" className="btn-danger-ghost btn" style={{padding:4}} disabled={busy} onClick={onClose}>✕</button></div>
      <p className="text-[12px] mb-4" style={{color:"var(--text-muted)"}}>Upload .xlsx or .xls. Existing leads are overwritten when their email or optional unique ID matches; new rows are inserted.</p>
      <div className="card p-4" style={{background:"var(--surface-raised)"}}><div className="text-[12px] font-medium mb-2">Expected headers</div><div className="text-[11px] font-mono leading-6" style={{color:"var(--text-secondary)"}}>Lead Name · Email · Deal Stage · HubSpot URL · Channel · Date Acquired · Vendor · Lead Status · Projected Deal Amount · Closed Contract Amount · Contract Sent · VA Onboarded</div><div className="text-[11px] mt-2" style={{color:"var(--text-muted)"}}>Optional: ID / Lead ID. Lead Status is used for status; Deal Stage is used as a fallback. Email is the primary duplicate key.</div></div>
      <input ref={fileRef} type="file" accept=".xlsx,.xls" className="hidden" onChange={e=>processFile(e.target.files?.[0])}/>
      <div className="flex justify-end gap-2 mt-4"><button type="button" className="btn btn-ghost" disabled={busy} onClick={onClose}>Close</button><button type="button" className="btn btn-primary" disabled={busy} onClick={()=>fileRef.current?.click()}>{busy?"Uploading…":"Choose Excel file"}</button></div>
      {error&&<div className="err-text mt-3" style={{minHeight:0}}>{error}</div>}
      {result&&<div className="card mt-4 p-4" style={{background:"var(--accent-wash)"}}><div className="font-medium text-[13px]">Upload complete</div><div className="text-[12px] mt-2" style={{color:"var(--text-secondary)"}}>{result.added} new leads added, {result.updated} existing leads updated{result.failed?`, ${result.failed} rows failed`:""}.</div>{result.errors?.length>0&&<div className="text-[11px] mt-2 max-h-28 overflow-auto" style={{color:"var(--critical)"}}>{result.errors.slice(0,12).map((x,i)=><div key={i}>{x}</div>)}</div>}</div>}
    </div>
  </div>;
}

/* ================= add lead modal ================= */
const EMPTY_FORM = { name:"", email:"", hubspotUrl:"", vendorType:"meta", vendor:"", dateAcquired:"", status:"New", projectedDealAmount:0, closedContractAmount:0, contractSent:false, vaOnboarded:false };
function AddLeadModal({ vendors, onClose, onSubmit }){
  const activeByType = useMemo(()=>{
    const m = {};
    CHANNELS.forEach(c=>{ m[c.key] = vendors.filter(v=>v.type===c.key && v.status==="Active"); });
    return m;
  }, [vendors]);
  const initialType = CHANNELS.find(c=>activeByType[c.key].length)?.key || "meta";
  const [form, setForm] = useState(()=>({
    ...EMPTY_FORM,
    vendorType: initialType,
    vendor: (activeByType[initialType][0] && activeByType[initialType][0].name) || "",
    dateAcquired: new Date().toISOString().slice(0,10),
  }));
  const [errors, setErrors] = useState({});
  const nameRef = useRef(null);
  useEffect(()=>{ nameRef.current && nameRef.current.focus(); }, []);
  useEffect(()=>{
    function onKey(e){ if (e.key === "Escape") onClose(); }
    document.addEventListener("keydown", onKey);
    return ()=>document.removeEventListener("keydown", onKey);
  }, [onClose]);

  function setField(key, value){ setForm(f=>({ ...f, [key]: value })); }
  function handleTypeChange(type){
    const opts = activeByType[type];
    setForm(f=>({ ...f, vendorType: type, vendor: (opts[0] && opts[0].name) || "" }));
  }
  function handleSubmit(e){
    e.preventDefault();
    const errs = {};
    if (!form.name.trim()) errs.name = "Enter the lead's name.";
    if (!form.vendor) errs.vendor = "Choose a vendor.";
    if (!form.dateAcquired) errs.dateAcquired = "Choose a date.";
    setErrors(errs);
    if (Object.keys(errs).length) return;
    onSubmit({
      ...form,
      name: form.name.trim(),
      email: form.email.trim(),
      hubspotUrl: form.hubspotUrl.trim(),
      projectedDealAmount: Math.max(0, parseFloat(form.projectedDealAmount)||0),
      closedContractAmount: Math.max(0, parseFloat(form.closedContractAmount)||0),
    });
  }
  const vendorOptions = activeByType[form.vendorType];
  return (
    <div className="modal-overlay" onMouseDown={e=>{ if (e.target===e.currentTarget) onClose(); }}>
      <div className="card w-full max-w-[460px] p-5" role="dialog" aria-modal="true" aria-labelledby="modal-title" onMouseDown={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between mb-4">
          <h3 id="modal-title" className="font-display font-semibold text-[16px]">Add a lead</h3>
          <button type="button" className="btn-danger-ghost btn" style={{padding:4}} onClick={onClose}>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 3L13 13M13 3L3 13" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/></svg>
          </button>
        </div>
        <form onSubmit={handleSubmit} className="flex flex-col gap-3.5" noValidate>
          <div>
            <label className="field-label" htmlFor="f-name">Lead name</label>
            <input id="f-name" ref={nameRef} className="input" type="text" placeholder="e.g. Jordan Blake" autoComplete="off"
              value={form.name} onChange={e=>setField("name", e.target.value)} />
            <div className="err-text">{errors.name}</div>
          </div>
          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="field-label" htmlFor="f-email">Lead email <span style={{fontWeight:400, color:"var(--text-muted)"}}>(optional)</span></label>
              <input id="f-email" className="input" type="email" placeholder="jordan@example.com" autoComplete="off"
                value={form.email} onChange={e=>setField("email", e.target.value)} />
            </div>
            <div>
              <label className="field-label" htmlFor="f-hubspot">HubSpot URL <span style={{fontWeight:400, color:"var(--text-muted)"}}>(optional)</span></label>
              <input id="f-hubspot" className="input" type="url" placeholder="https://app.hubspot.com/…" autoComplete="off"
                value={form.hubspotUrl} onChange={e=>setField("hubspotUrl", e.target.value)} />
            </div>
          </div>
          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="field-label">Channel</label>
              <select className="select" value={form.vendorType} onChange={e=>handleTypeChange(e.target.value)}>
                {CHANNELS.map(c=><option key={c.key} value={c.key}>{c.label}</option>)}
              </select>
            </div>
            <div>
              <label className="field-label" htmlFor="f-date">Date acquired</label>
              <input id="f-date" className="input" type="date" min="2025-01-01" max="2030-12-31" value={form.dateAcquired} onChange={e=>setField("dateAcquired", e.target.value)} />
              <div className="err-text">{errors.dateAcquired}</div>
            </div>
          </div>
          <div>
            <label className="field-label">Vendor</label>
            <select className="select" value={form.vendor} onChange={e=>setField("vendor", e.target.value)} disabled={!vendorOptions.length}>
              {vendorOptions.length
                ? vendorOptions.map(v=><option key={v.name} value={v.name}>{v.name}</option>)
                : <option value="">No active vendors in this channel</option>}
            </select>
            {!vendorOptions.length && <div className="field-hint">Add a vendor or reactivate an offboarded one in the budget &amp; spend panel first.</div>}
            <div className="err-text">{errors.vendor}</div>
          </div>
          <div>
            <label className="field-label">Lead status</label>
            <select className="select" value={form.status} onChange={e=>setField("status", e.target.value)}>
              {STATUSES.map(s=><option key={s} value={s}>{s}</option>)}
            </select>
          </div>
          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="field-label" htmlFor="f-proj">Projected deal amount</label>
              <div className="relative">
                <span className="absolute left-3 top-1/2 -translate-y-1/2 text-[13px]" style={{color:"var(--text-muted)"}}>$</span>
                <input id="f-proj" className="input" style={{paddingLeft:22}} type="number" min="0" step="1"
                  value={form.projectedDealAmount} onChange={e=>setField("projectedDealAmount", e.target.value)} />
              </div>
            </div>
            <div>
              <label className="field-label" htmlFor="f-closed">Closed contract amount</label>
              <div className="relative">
                <span className="absolute left-3 top-1/2 -translate-y-1/2 text-[13px]" style={{color:"var(--text-muted)"}}>$</span>
                <input id="f-closed" className="input" style={{paddingLeft:22}} type="number" min="0" step="1"
                  value={form.closedContractAmount} onChange={e=>setField("closedContractAmount", e.target.value)} />
              </div>
            </div>
          </div>
          <div className="flex items-center gap-5">
            <label className="flex items-center gap-2 text-[13px] font-medium" style={{color:"var(--text-secondary)"}}>
              <input type="checkbox" className="checkbox" checked={form.contractSent} onChange={e=>setField("contractSent", e.target.checked)} />

            </label>
            <label className="flex items-center gap-2 text-[13px] font-medium" style={{color:"var(--text-secondary)"}}>
              <input type="checkbox" className="checkbox" checked={form.vaOnboarded} onChange={e=>setField("vaOnboarded", e.target.checked)} />
              VA onboarded
            </label>
          </div>

          <div className="flex justify-end gap-2 mt-2">
            <button type="button" className="btn btn-ghost" onClick={onClose}>Cancel</button>
            <button type="submit" className="btn btn-primary" disabled={!vendorOptions.length}>Add lead</button>
          </div>
        </form>
      </div>
    </div>

    }
    let payload=uiLeadToDb(data);
    let {data:r,error}=await supabaseClient.from("leads").insert(payload).select().single();
    
    if(error){showToast(error.message||"Couldn’t add lead");return;}
    setLeads(ls=>[dbLeadToUi(r),...ls]);setModalOpen(false);setDuplicateLead(null);showToast("Lead added ✓");
  }
  async function handleEditLead(data){if(!isAdmin||!editLead)return;const {data:r,error}=await supabaseClient.from("leads").update(uiLeadToDb(data)).eq("id",editLead.id).select().single();if(error){showToast(error.message||"Couldn't update lead");return;}setLeads(ls=>ls.map(x=>x.id===r.id?dbLeadToUi(r):x));setEditLead(null);showToast("Lead updated ✓");}
  async function handleAddVendor({name,type}){if(!isAdmin)return;const {data:r,error}=await supabaseClient.from("vendors").insert({name,type,status:"Active"}).select().single();if(error){showToast(error.message||"Couldn't add vendor");return;}setVendors(vs=>[...vs,dbVendorToUi(r)].sort((a,b)=>a.name.localeCompare(b.name)));setAddVendorOpen(false);showToast("Vendor added ✓");}
  async function handleToggleVendorStatus(name){if(!isAdmin)return;const v=vendors.find(x=>x.name===name);if(!v)return;const status=v.status==="Active"?"Offboarded":"Active";const {error}=await supabaseClient.from("vendors").update({status}).eq("id",v.id);if(error)showToast("Couldn't update vendor");else setVendors(vs=>vs.map(x=>x.id===v.id?{...x,status}:x));}
  async function handleSignOut(){await supabaseClient.auth.signOut();}
  function showToast(msg){setToast(msg);setTimeout(()=>setToast(""),2000);}
  function handleSort(setter, key){
    setter(s=> s.key===key ? { key, dir: s.dir==="asc"?"desc":"asc" } : { key, dir:"asc" });
  }
  function resetFilters(){ setFilters({ range:"all", year:"all", month:"all", type:"all", status:"all", search:"" }); }

  function exportPeriod(){
    return (filters.year!=="all" || filters.month!=="all")
      ? (financeScope.label || "filtered").replace(/\s+/g,"-")
      : (filters.range==="all" ? "all-time" : "last-"+filters.range+"-days");
  }

  function downloadExcel(kind){
    if (!window.XLSX){ showToast("Excel export is still loading…"); return; }
    const period = exportPeriod();
    let rows = [];
    let filename = "";
    let sheetName = "Export";

    if (kind === "leads") {
      rows = filteredLeads.map(l => ({
        "Lead Name": l.name,
        "Email": l.email || "",
        "HubSpot URL": l.hubspotUrl || "",
        "Channel": channelInfo(l.vendorType).label,
        "Vendor": l.vendor,
        "Date Acquired": l.dateAcquired,
        "Status": l.status,
        "Projected Deal Amount": Number(l.projectedDealAmount || 0),
        "Closed Contract Amount": Number(l.closedContractAmount || 0),
        "Contract Sent": l.contractSent ? "Yes" : "No",
        "VA Onboarded": l.vaOnboarded ? "Yes" : "No"
      }));
      filename = "lead-list_" + period + ".xlsx";
      sheetName = "Lead List";
    } else if (kind === "vendors") {
      rows = vendorRows.map(r => ({
        "Vendor": r.key,
        "Channel": channelInfo(r.type).label,
        "Status": r.status,
        "Total Spend": Number(r.spend || 0),
        "Total Leads": r.totalLeads,
        "Demos Booked": r.qualifiedDemosBooked,
        "Demos Completed": r.totalDemosCompleted,
        "CPL": Number(r.cpl || 0),
        "CPQL": Number(r.cpql || 0),
        "ROAS": Number(r.roas || 0),
        "CAC": Number(r.cac || 0)
      }));
      filename = "vendor-performance_" + period + ".xlsx";
      sheetName = "Vendor Performance";
    } else {
      const m = overallMetrics;
      rows = [
        {"Metric":"Budget","Value":m.budget},
        {"Metric":"Spend","Value":m.spend},
        {"Metric":"Total Leads","Value":m.totalLeads},
        {"Metric":"Qualified Leads","Value":m.qualifiedLeads},
        {"Metric":"Do Not Contact Leads","Value":m.dncLeads},
        {"Metric":"Unqualified Leads","Value":m.unqualifiedLeads},
        {"Metric":"Qualified Demos Booked","Value":m.qualifiedDemosBooked},
        {"Metric":"Total Demos Completed","Value":m.totalDemosCompleted},
        {"Metric":"CPL","Value":Number(m.cpl || 0)},
        {"Metric":"CPQL","Value":Number(m.cpql || 0)},
        {"Metric":"Cost per Qualified Demo Booked","Value":Number(m.costPerQualDemo || 0)},
        {"Metric":"Cost per Demo Completed","Value":Number(m.costPerDemoCompleted || 0)},
        {"Metric":"Contracts Sent","Value":m.contractsSent},
        {"Metric":"Active Clients","Value":m.activeClients},
        {"Metric":"VA Onboarded","Value":m.vaOnboarded},
        {"Metric":"Total Projected Deal Amount","Value":m.totalProjectedDeal},
        {"Metric":"Total Closed Contract Amount","Value":m.totalClosedContract},
        {"Metric":"Conversion Rate (%)","Value":Number(m.conversionRate || 0)},
        {"Metric":"ROAS","Value":Number(m.roas || 0)},
        {"Metric":"CAC","Value":Number(m.cac || 0)},
        {"Metric":"Period","Value":period}
      ];
      filename = "executive-summary_" + period + ".xlsx";
      sheetName = "Executive Summary";
    }

    const worksheet = XLSX.utils.json_to_sheet(rows);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, sheetName);
    worksheet["!cols"] = Object.keys(rows[0] || {}).map(key => ({ wch: Math.min(Math.max(key.length + 3, 14), 32) }));
    XLSX.writeFile(workbook, filename);
    showToast("Downloaded " + filename);
  }

  function handleExport(kind){
    downloadExcel(kind);
  }

  return (
    <div className="min-h-screen">
      <div className="max-w-[1280px] mx-auto px-4 md:px-6 py-6 flex flex-col gap-6">

        <header className="flex flex-col gap-3">
          <div className="flex items-center gap-2 pb-3" style={{borderBottom:"1px solid var(--border)"}}>
            <svg width="26" height="26" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <rect width="26" height="26" rx="7" fill="var(--accent)"/>
              <text x="13" y="18.5" textAnchor="middle" fontFamily="Sora, sans-serif" fontWeight="800" fontSize="14" fill="var(--accent-contrast)">M</text>
            </svg>
            <span className="font-display font-bold text-[13px]" style={{letterSpacing:"0.02em"}}>MedVirtual</span>
            <span style={{color:"var(--text-muted)"}}>/</span>
            <span className="text-[13px] font-medium" style={{color:"var(--text-secondary)"}}>Lead Vendor Dashboard</span>
          </div>
          <div className="flex flex-wrap items-center justify-between gap-4">
            <div>
              <h1 className="font-display font-bold text-[21px] leading-tight">Lead Vendor Dashboard</h1>
              <div className="flex items-center gap-1.5 mt-0.5">
                <span className="live-dot"></span>
                <span className="text-[11.5px]" style={{color:"var(--text-muted)"}}>Live &middot; recalculates as leads, vendors, budget or spend change</span>
              </div>
            </div>
            <div className="flex items-center gap-2 flex-wrap">
              <span className="text-[11px]" style={{color:syncing?"var(--warning)":"var(--good)"}}>{syncing?"Syncing…":"Synced with Supabase"}</span>
              {session ? <><span className="text-[12px]" style={{color:"var(--text-secondary)"}}>{profile?.full_name||session?.user?.email} · {isAdmin?"Admin":"Viewer"}</span><button className="btn btn-ghost" onClick={handleSignOut}>Sign out</button></> : <span className="text-[12px]" style={{color:"var(--text-secondary)"}}>Signed in</span>}
              <ExportMenu onExport={handleExport} />
              {isAdmin&&<button className="btn btn-ghost" onClick={()=>setBulkUploadOpen(true)}>Bulk upload</button>}
              {isAdmin&&<button className="btn btn-primary" onClick={()=>setModalOpen(true)}><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1V13M1 7H13" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg>Add lead</button>}
            </div>
          </div>
        </header>

        <div className="card px-4 py-3 flex flex-wrap items-center gap-3">
          <span className="eyebrow mr-1">Filter</span>
          <Segmented value={(filters.year==="all" && filters.month==="all") ? filters.range : "__none__"}
            onChange={v=>setFilters(f=>({...f,range:v,year:"all",month:"all"}))}
            options={[{value:"all",label:"All time"},{value:"7",label:"7d"},{value:"30",label:"30d"},{value:"90",label:"90d"}]} />
          <select className="select" style={{width:"auto", minWidth:110}} value={filters.year} onChange={e=>setFilters(f=>({...f,year:e.target.value}))}>
            <option value="all">Year: all</option>
            {YEARS.map(y=><option key={y} value={y}>{y}</option>)}
          </select>
          <select className="select" style={{width:"auto", minWidth:140}} value={filters.month} onChange={e=>setFilters(f=>({...f,month:e.target.value}))}>
            <option value="all">Month: all</option>
            {MONTH_OPTIONS.map(o=><option key={o.value} value={o.value}>{o.label}</option>)}
          </select>
          <Segmented value={filters.type} onChange={v=>setFilters(f=>({...f,type:v}))}
            options={[{value:"all",label:"All channels"}, ...CHANNELS.map(c=>({value:c.key,label:c.label,dotColor:"var("+c.series+")"}))]} />
          <select className="select" style={{width:"auto", minWidth:140}} value={filters.status} onChange={e=>setFilters(f=>({...f,status:e.target.value}))}>
            <option value="all">All statuses</option>
            {STATUSES.map(s=><option key={s} value={s}>{s}</option>)}
          </select>
          <div className="relative flex-1" style={{minWidth:180}}>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" className="absolute left-3 top-1/2 -translate-y-1/2" style={{color:"var(--text-muted)"}}><circle cx="6" cy="6" r="4.6" stroke="currentColor" strokeWidth="1.6"/><path d="M9.5 9.5L13 13" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/></svg>
            <input className="input" style={{paddingLeft:30}} type="text" placeholder="Search lead, email or vendor name…" value={filters.search} onChange={e=>setFilters(f=>({...f,search:e.target.value}))} />
          </div>
          {filtersActive && <button className="btn btn-ghost" onClick={resetFilters}>Reset</button>}
        </div>

        <KpiRow metrics={overallMetrics} weeklyTotals={weeklySeries.total||[]} weeklyConv={weeklySeries.conv||[]} topVendorLabel={topVendor} monthLabelText={financeScope.label} />

        <InsightsPanel vendorRows={vendorRows} overallMetrics={overallMetrics} periodLabel={financeScope.label} />

        <div className="grid grid-cols-1 lg:grid-cols-5 gap-4">
          <div className="card p-4 lg:col-span-2 flex flex-col">
            <h2 className="section-title">Lead volume by channel</h2>
            <p className="text-[12px] mb-4" style={{color:"var(--text-muted)"}}>Share of leads acquired across Meta Ads, Email &amp; Website</p>
            <div className="flex-1 flex flex-col justify-center"><ChannelSplit channelRows={channelRows} /></div>
          </div>
          <div className="card p-4 lg:col-span-3 flex flex-col">
            <h2 className="section-title">Conversion rate over time</h2>
            <p className="text-[12px] mb-2" style={{color:"var(--text-muted)"}}>Weekly conversion rate by channel</p>
            <div style={{height:230}}>
              {overallMetrics.totalLeads === 0
                ? <div className="empty-state h-full flex items-center justify-center">No leads logged yet — add one to see this chart populate.</div>
                : <ConversionChart series={weeklySeries} themeTick={themeTick} />}
            </div>
          </div>
        </div>

        <div className="card p-4">
          <h2 className="section-title">Lead lifecycle funnel</h2>
          <p className="text-[12px] mb-2" style={{color:"var(--text-muted)"}}>Total leads through qualification, demos and active clients</p>
          <div style={{height:220}}>
            {overallMetrics.totalLeads === 0
              ? <div className="empty-state h-full flex items-center justify-center">No leads logged yet — add one to see the funnel populate.</div>
              : <FunnelChart metrics={overallMetrics} themeTick={themeTick} />}
          </div>
        </div>

        <DncLeadsTable leads={leads} />

        <div className="card p-4">
          <h2 className="section-title">Closed contract amount by vendor</h2>
          <p className="text-[12px] mb-2" style={{color:"var(--text-muted)"}}>Actualized revenue per vendor, ranked highest to lowest</p>
          <div style={{height:260}}>
            {overallMetrics.totalLeads === 0
              ? <div className="empty-state h-full flex items-center justify-center">No revenue logged yet — mark a lead as an Active Client to see this chart populate.</div>
              : <RevenueByVendorChart rows={vendorRows} themeTick={themeTick} />}
          </div>
        </div>

        <VendorFinancePanel vendors={vendors} finance={finance} scope={financeScope}
          onChange={updateFinance} onToggleStatus={handleToggleVendorStatus} onAddVendorClick={()=>setAddVendorOpen(true)} isAdmin={isAdmin} />

        <div className="flex flex-col gap-3">
          <div className="flex items-center justify-between flex-wrap gap-3">
            <h2 className="section-title">Vendor performance</h2>
            <Segmented value={activeTab} onChange={setActiveTab} options={METRIC_TABS.map(t=>({value:t.key,label:t.label}))} />
          </div>
          <ChannelSummaryCards channelRows={channelRows} activeTab={activeTab} />
          <div className="card">
            <VendorTable rows={vendorRows} activeTab={activeTab} sortState={vendorSort} onSort={k=>handleSort(setVendorSort,k)} />
          </div>
        </div>

        <LeadsTable leads={filteredLeads} totalCount={leads.length} sortState={leadsSort} onSort={k=>handleSort(setLeadsSort,k)}
          onStatusChange={handleStatusChange} onToggleContract={handleToggleContract} onToggleVA={handleToggleVA} onDelete={handleDelete} onEdit={setEditLead} isAdmin={isAdmin} />

        <footer className="text-center text-[11.5px] py-4" style={{color:"var(--text-muted)"}}>
          This dashboard starts empty. Log a lead, add vendors, and enter budget/spend above to see every metric recalculate live. Changes are saved to Supabase immediately and synchronized live for authorized users.
        </footer>
      </div>

      {modalOpen && <AddLeadModal vendors={vendors} onClose={()=>setModalOpen(false)} onSubmit={handleAddLead} />}
      {duplicateLead && <DuplicateLeadModal lead={duplicateLead.existing} onSubmitAnyway={()=>handleAddLead(duplicateLead.data,true)} onCancel={()=>setDuplicateLead(null)} onDiscard={()=>{setDuplicateLead(null);setModalOpen(false);}} />}
      {bulkUploadOpen && <BulkUploadModal vendors={vendors} onClose={()=>setBulkUploadOpen(false)} onComplete={async()=>{await loadDashboardData();showToast("Excel upload synced ✓");}} />}
      {editLead && <EditLeadModal lead={editLead} vendors={vendors} onClose={()=>setEditLead(null)} onSubmit={handleEditLead} />}
      {addVendorOpen && <AddVendorModal existingNames={vendors.map(v=>v.name)} onClose={()=>setAddVendorOpen(false)} onSubmit={handleAddVendor} />}
      
      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

class DashboardErrorBoundary extends React.Component {
  constructor(props){ super(props); this.state={error:null}; }
  static getDerivedStateFromError(error){ return {error}; }
  componentDidCatch(error,info){ console.error("Dashboard render error:",error,info); }
  render(){
    if(this.state.error){
      return <div style={{padding:"24px",fontFamily:"IBM Plex Sans, sans-serif",color:"#111",background:"#fff",minHeight:"100vh"}}>
        <h2 style={{fontFamily:"Sora, sans-serif",fontSize:"20px",marginBottom:"8px"}}>Dashboard could not load</h2>
        <p style={{fontSize:"13px",color:"#555",marginBottom:"12px"}}>A JavaScript error occurred while rendering the dashboard.</p>
        <pre style={{whiteSpace:"pre-wrap",fontSize:"12px",background:"#f5f5f5",padding:"12px",borderRadius:"8px",overflow:"auto"}}>{String(this.state.error?.message||this.state.error)}</pre>
      </div>;
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(<DashboardErrorBoundary><App /></DashboardErrorBoundary>);
</script>
